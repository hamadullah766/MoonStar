<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ads - MoonStar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html,body{background:linear-gradient(135deg,#8FA8C0 0%,#A8BDD1 50%,#8FA8C0 100%);min-height:100vh}
body{color:#1E293B;padding-bottom:130px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;pointer-events:none}
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.9);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(30,41,59,0.05)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo-circle{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#DC2626,#991B1B);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 15px rgba(220,38,38,0.3)}
.header-logo-circle svg{width:22px;height:22px}
.header-logo{font-size:20px;font-weight:900;color:#0F2847}
.container{position:relative;z-index:1;padding:20px;max-width:520px;margin:0 auto}
.balance-strip{background:linear-gradient(135deg,#DC2626 0%,#991B1B 100%);border-radius:22px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(220,38,38,0.3);color:white;display:flex;justify-content:space-between;align-items:center}
.balance-block .lbl{font-size:9px;color:rgba(255,255,255,0.8);letter-spacing:2px;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.balance-block .val{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1}
.balance-block .val span{font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);margin-right:4px}
.balance-right .lbl{font-size:9px;color:rgba(255,255,255,0.8);letter-spacing:2px;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.balance-right .val{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1;color:#FFFFFF}
.info-banner{background:#FFFFFF;border:1.5px solid #FECACA;border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(30,41,59,0.06)}
.info-banner svg{width:16px;height:16px;stroke:#DC2626;flex-shrink:0}
.info-banner .info-text{font-size:12px;font-weight:700;color:#991B1B}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 4px}
.top-title{font-size:12px;font-weight:800;color:#64748B;letter-spacing:1.5px;text-transform:uppercase}
.top-count{font-size:12px;font-weight:800;color:#DC2626}
.ads-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.ad-card{background:#FFFFFF;border:1.5px solid rgba(255,255,255,0.9);border-radius:18px;padding:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(30,41,59,0.08)}
.ad-card.locked{opacity:0.5}
.ad-card.completed{border-color:#86EFAC;background:#F0FDF4}
.ad-card.active{border-color:#FECACA;box-shadow:0 15px 40px rgba(220,38,38,0.2)}
.ad-card.counting{border-color:#FECACA;background:#FEF2F2}
.ad-card.ready{border-color:#86EFAC;background:#F0FDF4;box-shadow:0 15px 40px rgba(16,185,129,0.25)}
.ad-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ad-num{width:38px;height:38px;border-radius:12px;background:#FEE2E2;border:1px solid #FECACA;color:#DC2626;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.ad-card.completed .ad-num,.ad-card.ready .ad-num{background:#D1FAE5;border-color:#86EFAC;color:#059669}
.ad-reward{font-size:12px;font-weight:800;color:#DC2626}
.ad-card.completed .ad-reward{color:#059669}
.ad-title{font-size:14px;font-weight:800;color:#0F2847;margin-bottom:3px}
.ad-subtitle{font-size:11px;color:#64748B;margin-bottom:12px;font-weight:500}
.timer-box{background:linear-gradient(135deg,#DC2626,#991B1B);border-radius:12px;padding:12px;text-align:center;color:white}
.timer-label{font-size:9px;font-weight:800;letter-spacing:1.5px;opacity:0.85;margin-bottom:4px;text-transform:uppercase}
.timer-value{font-size:26px;font-weight:900;font-family:'Courier New',monospace;line-height:1}
.reset-info{font-size:9px;color:#94A3B8;text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid #F1F5F9;font-weight:700}
.reset-info .reset-time{color:#DC2626;font-family:'Courier New',monospace;font-weight:800;font-size:10px}
.ad-btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:12px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif}
.ad-btn.watch{background:linear-gradient(135deg,#DC2626,#B91C1C);color:white;box-shadow:0 6px 20px rgba(220,38,38,0.3)}
.ad-btn.claim{background:linear-gradient(135deg,#10B981,#059669);color:white;box-shadow:0 6px 20px rgba(16,185,129,0.4)}
.ad-btn.done{background:#D1FAE5;color:#059669;cursor:not-allowed;border:1px solid #86EFAC}
.ad-btn.locked{background:#F1F5F9;color:#94A3B8;cursor:not-allowed;border:1px solid #E2E8F0}
.bottom-nav{position:fixed;bottom:16px;left:16px;right:16px;background:#FFFFFF;border:1.5px solid rgba(255,255,255,0.9);border-radius:24px;display:flex;justify-content:space-around;align-items:center;padding:10px 8px;box-shadow:0 20px 50px rgba(30,41,59,0.2);z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:#94A3B8;text-decoration:none;font-size:10px;font-weight:700;padding:4px 8px;flex:1;max-width:72px}
.nav-item.active{color:#DC2626}
.nav-icon-wrap{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.nav-icon-wrap svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.nav-item.active .nav-icon-wrap{background:#FEE2E2;border:1px solid #FECACA}
.nav-item.vip .nav-icon-wrap{background:linear-gradient(135deg,#DC2626,#991B1B);border-radius:50%;color:#FFFFFF}
.nav-item.vip .nav-icon-wrap svg{fill:currentColor;stroke:none}
</style>
</head>
<body>
<div class="header">
<div class="header-left">
<div class="header-logo-circle"><svg viewBox="0 0 100 100"><path d="M55 20 A32 32 0 1 0 55 80 A25 25 0 1 1 55 20 Z" fill="#FFF"/><polygon points="65,32 69,45 82,45 72,53 75,66 65,58 55,66 58,53 48,45 61,45" fill="#FFF"/></svg></div>
<div class="header-logo">MoonStar</div>
</div>
</div>

<div class="container">
<div class="balance-strip">
<div class="balance-block">
<div class="lbl">Balance</div>
<div class="val"><span>Rs</span><span id="balance">0</span></div>
</div>
<div class="balance-right">
<div class="lbl">Earned Today</div>
<div class="val" id="earnedToday">0</div>
</div>
</div>

<div class="info-banner">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
<div class="info-text">Next reset in <span id="topResetTime">--:--:--</span></div>
</div>

<div class="top-bar">
<div class="top-title">Today's Ads</div>
<div class="top-count"><span id="adsToday">0</span> / 20 done</div>
</div>

<div class="ads-grid" id="adsGrid"></div>
</div>

<div class="bottom-nav">
<a href="/dashboard" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div>Home</div></a>
<a href="/refer" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div>Invite</div></a>
<a href="/ads" class="nav-item active"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div><div>Task</div></a>
<a href="/profile" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div>Profile</div></a>
<a href="/vip" class="nav-item vip"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg></div><div>VIP</div></a>
</div>

<script src="/toast.js"></script>
<script>
var ADS_LINK = 'https://www.effectivegatecpm.com/xxxxxxx';
var TOTAL_ADS = 20;
var REWARD = 1;
var WATCH_TIME = 15;

/* ============ LOAD USER ============ */
var user = JSON.parse(localStorage.getItem('user') || '{}');
if (!user.id) { window.location.href = '/login'; }

/* ============ DAILY RESET (FIXED) ============ */
function checkDailyReset() {
  var today = new Date().toDateString();
  var lastReset = user.lastResetDate || '';

  // Pehli baar - sirf date set karo, reset nahi
  if (lastReset === '') {
    user.lastResetDate = today;
    localStorage.setItem('user', JSON.stringify(user));
    // Sync to server
    fetch('/api/users/' + user.id + '/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lastResetDate: today })
    }).catch(function(){});
    return false;
  }

  // Same day - no reset
  if (lastReset === today) {
    return false;
  }

  // New day - FULL RESET
  user.balance = 0;
  user.adsToday = 0;
  user.earnedToday = 0;
  user.adsCompleted = 0;
  user.lastResetDate = today;
  localStorage.setItem('user', JSON.stringify(user));
  // Sync to server
  fetch('/api/users/' + user.id + '/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      balance: 0,
      adsToday: 0,
      earnedToday: 0,
      adsCompleted: 0,
      lastResetDate: today
    })
  }).catch(function(){});
  return true;
}

var wasReset = checkDailyReset();

var adsToday = user.adsToday || 0;
var balance = user.balance || 0;
var earnedToday = user.earnedToday || 0;
var activeAdIndex = -1;
var timeLeft = 0;
var timerInterval = null;
var claimReady = false;

/* ============ SAVE USER (central function) ============ */
function saveUser() {
  user.balance = balance;
  user.adsToday = adsToday;
  user.earnedToday = earnedToday;
  user.adsCompleted = user.adsCompleted || 0;
  user.lastResetDate = user.lastResetDate || new Date().toDateString();
  localStorage.setItem('user', JSON.stringify(user));
  
  // Sync to server
  fetch('/api/users/' + user.id + '/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      balance: user.balance,
      adsToday: user.adsToday,
      earnedToday: user.earnedToday,
      adsCompleted: user.adsCompleted,
      lastResetDate: user.lastResetDate
    })
  }).then(function(r){ return r.json(); }).then(function(res){
    console.log('Server sync:', res.success ? 'OK' : 'FAILED');
  }).catch(function(e){
    console.log('Server sync error:', e);
  });
}

function updateResetTime() {
  var now = new Date();
  var midnight = new Date();
  midnight.setHours(24,0,0,0);
  var diff = midnight - now;
  var h = Math.floor(diff/3600000);
  var m = Math.floor((diff%3600000)/60000);
  var s = Math.floor((diff%60000)/1000);
  var t = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  var el = document.getElementById('topResetTime');
  if (el) el.textContent = t;
  var els = document.querySelectorAll('.reset-time');
  for (var i = 0; i < els.length; i++) els[i].textContent = t;
}

function renderAds() {
  var grid = document.getElementById('adsGrid');
  grid.innerHTML = '';
  for (var i = 0; i < TOTAL_ADS; i++) {
    var num = (i+1).toString().padStart(2,'0');
    var isCompleted = i < adsToday;
    var isCounting = (i === activeAdIndex && timeLeft > 0);
    var isReady = (i === activeAdIndex && claimReady);
    var isActive = (i === adsToday && activeAdIndex === -1);
    var cls = 'ad-card';
    if (isCompleted) cls += ' completed';
    else if (isCounting) cls += ' counting';
    else if (isReady) cls += ' ready';
    else if (isActive) cls += ' active';
    else cls += ' locked';
    var sub = 'Watch to earn';
    if (isCompleted) sub = 'Reward claimed';
    else if (isCounting) sub = 'Please wait...';
    else if (isReady) sub = 'Ready to claim';
    var inner = '';
    if (isCounting) {
      inner = '<div class="timer-box"><div class="timer-label">Watching</div><div class="timer-value" id="timerValue">'+timeLeft+'s</div></div>';
    } else {
      var bc = 'ad-btn';
      var bt = '';
      var bd = '';
      var bo = '';
      if (isCompleted) { bc += ' done'; bt = 'Completed'; bd = 'disabled'; }
      else if (isReady) { bc += ' claim'; bt = 'Claim 1 PKR'; bo = 'claimReward()'; }
      else if (isActive) { bc += ' watch'; bt = 'Watch Now'; bo = 'startAd()'; }
      else { bc += ' locked'; bt = 'Locked'; bd = 'disabled'; }
      inner = '<button class="'+bc+'" '+bd+' onclick="'+bo+'">'+bt+'</button>';
    }
    grid.innerHTML += '<div class="'+cls+'"><div class="ad-header"><div class="ad-num">'+num+'</div><div class="ad-reward">+Rs '+REWARD+'</div></div><div class="ad-title">Ad '+num+'</div><div class="ad-subtitle">'+sub+'</div>'+inner+'<div class="reset-info">Resets in <span class="reset-time">--:--:--</span></div></div>';
  }
  document.getElementById('adsToday').textContent = adsToday;
  document.getElementById('balance').textContent = balance;
  document.getElementById('earnedToday').textContent = earnedToday;
  updateResetTime();
}

function startAd() {
  if (adsToday >= TOTAL_ADS) { showToast('Daily limit reached', 'error'); return; }
  activeAdIndex = adsToday;
  timeLeft = WATCH_TIME;
  claimReady = false;
  window.open(ADS_LINK, '_blank');
  showToast('Ad opened. Wait 15 seconds...', 'info');
  renderAds();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    timeLeft--;
    var tv = document.getElementById('timerValue');
    if (tv) tv.textContent = timeLeft + 's';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      claimReady = true;
      renderAds();
      showToast('Ad complete! Claim your reward.', 'success');
    }
  }, 1000);
}

function claimReward() {
  if (!claimReady) { showToast('Please wait', 'warning'); return; }
  
  // Update values
  balance = balance + REWARD;
  adsToday = adsToday + 1;
  earnedToday = earnedToday + REWARD;
  user.adsCompleted = (user.adsCompleted || 0) + 1;
  
  // Save EVERYTHING including lastResetDate
  saveUser(); syncToServer();
  
  activeAdIndex = -1;
  timeLeft = 0;
  claimReady = false;
  renderAds();
  showToast('1 PKR claimed!', 'success');
}

if (wasReset) {
  showToast('New day! Everything reset.', 'info');
}
renderAds();
updateResetTime();
setInterval(updateResetTime, 1000);

function syncToServer(){if(!user||!user.id)return;fetch("/api/users/"+user.id+"/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({balance:balance,adsToday:adsToday,earnedToday:earnedToday,adsCompleted:user.adsCompleted||0,lastResetDate:user.lastResetDate||new Date().toDateString()})}).then(function(r){return r.json()}).then(function(res){console.log("Sync:",res.success?"OK":"FAIL")}).catch(function(e){console.log("Sync error:",e.message)});}
</script>
</body>
</html>
