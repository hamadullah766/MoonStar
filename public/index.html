<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonStar - Earn Money Online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body {
  background: linear-gradient(135deg, #8FA8C0 0%, #A8BDD1 50%, #8FA8C0 100%);
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 20px; color: #1E293B;
  position: relative; overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px; z-index: 0; pointer-events: none;
}
.container { position: relative; z-index: 1; text-align: center; padding: 40px; max-width: 460px; width: 100%; }
.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, #DC2626, #991B1B);
  margin-bottom: 28px;
  box-shadow: 0 20px 50px rgba(220, 38, 38, 0.35);
}
.logo-mark svg { width: 60px; height: 60px; }
.logo-text { font-size: 52px; font-weight: 900; letter-spacing: -2.5px; color: #0F2847; margin-bottom: 10px; line-height: 1; }
.tagline { font-size: 16px; color: #475569; margin-bottom: 36px; font-weight: 500; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; background: rgba(255, 255, 255, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 50px;
  color: #0F2847; font-size: 13px; font-weight: 600; margin-bottom: 36px;
  backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(30, 41, 59, 0.08);
}
.dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; box-shadow: 0 0 12px #10B981; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.btns { display: flex; gap: 12px; justify-content: center; }
.btn {
  padding: 16px 34px; border-radius: 14px; font-size: 15px; font-weight: 700;
  text-decoration: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Inter', sans-serif; cursor: pointer; border: none; letter-spacing: 0.2px;
}
.btn-primary { background: linear-gradient(135deg, #DC2626, #B91C1C); color: white; box-shadow: 0 12px 30px rgba(220, 38, 38, 0.35); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 18px 45px rgba(220, 38, 38, 0.5); }
.btn-outline { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.9); color: #0F2847; backdrop-filter: blur(10px); }
.btn-outline:hover { background: #FFFFFF; transform: translateY(-3px); box-shadow: 0 18px 40px rgba(30, 41, 59, 0.15); }
</style>
</head>
<body>
<div class="container">
  <div class="logo-mark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M55 20 A32 32 0 1 0 55 80 A25 25 0 1 1 55 20 Z" fill="#FFFFFF"/>
      <polygon points="65,32 69,45 82,45 72,53 75,66 65,58 55,66 58,53 48,45 61,45" fill="#FFFFFF"/>
    </svg>
  </div>
  <div class="logo-text">MoonStar</div>
  <div class="tagline">Earn real money by watching ads</div>
  <div class="badge">
    <div class="dot"></div>
    All systems operational
  </div>
  <div class="btns">
    <a href="/signup" class="btn btn-primary">Get Started</a>
    <a href="/login" class="btn btn-outline">Sign In</a>
  </div>
</div>
</body>
</html>
